# Configuration for fine-tuning YOLO on SoccerNet with target classes (ball, goalkeeper, other, player, referee)

defaults:
  - dataset: soccernet_gs
  - eval: detection_only  # Use detection-only evaluator
  - engine: offline
  - callbacks/visualization_callback: debug  # Disable visualization for faster training
  - callbacks/export_callback: mot  # Export in MOT format
  - pipeline/bbox_detector: yolo_ultralytics
  - pipeline/reid: kpr
  - pipeline/track: oc_sort
  - _self_

# Module order - YOLO detector only for detection evaluation
module_order:
  - bbox_detector  # This will train the YOLO model on SoccerNet data
  #- reid
  #- track

# Experiment settings
experiment_name: "yolo_soccernet_finetune"
home_dir: "${oc.env:HOME}"
data_dir: "${project_dir}/data"
model_dir: "${project_dir}/pretrained_models"

# Machine configuration
num_cores: 32
use_wandb: False  # Set to True if you want to use Weights & Biases logging
use_rich: True

# Flags
infer_tracking: True
print_config: False

# Callback configuration overrides
callbacks:
  eval_callback:

# Tracker state
state:
  save_file: null 
  load_file: null

# Dataset configuration
dataset:
  nvid: 1  # Process all videos (-1 means full dataset)
  

# Configure Hydra to use the current working directory
project_dir: "${hydra:runtime.cwd}"