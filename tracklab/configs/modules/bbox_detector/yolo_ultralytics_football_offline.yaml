_target_: tracklab.pipeline.bbox_detector.yolo_ultralytics_api.YOLOUltralytics

# Offline / high-accuracy preset for football (soccer) games
# Follows same `cfg:` structure as `yolo_ultralytics_soccernet.yaml` so the wrapper
# receives expected keys like `path_to_checkpoint` and `training`.
batch_size: 8
training_enabled: True
cfg:
  # Start fresh training with YOLOv11x - comment out path_to_checkpoint to use default_model
  path_to_checkpoint: "${project_dir}/pretrained_models/yolo/yolo11x.pt"
 
  # Low-level default if no path provided by the user
  default_model: "yolo11x.pt"

    # Save path for trained model
  save_path: "${project_dir}/pretrained_models/yolo/yolo11x_finetuned_soccernet.pt"

  # Detector-level minimum confidence used by the wrapper
  min_confidence: 0.2


  # Optional offline-only hints (not strictly required by the YOLO API)
  tta: ["horizontal_flip"]
  postproc:
    soft_nms: True
    size_filter_min_area_ratio: 0.0008

 
  training:
    # YOLO11x optimized training settings for speed and accuracy
    epochs: 100
    batch_size: 16       # Optimized for YOLO11x stability
    img_size: 1280       # Keep high for accuracy
    data_path: null      # set to your dataset path or leave as TrackingDataset input

    # Start fresh training (no resume)
    resume: false

    # YOLO11x optimized optimizer and lr schedule
    optimizer: AdamW
    lr0: 0.0005          # Optimized for YOLO11x convergence speed
    lrf: 0.1             # Higher final LR ratio for better fine-tuning
    momentum: 0.9
    weight_decay: 0.0005 # Standard weight decay

    # Reduced augmentations for YOLO11x training stability
    augmentation:
      hsv_h: 0.01        # Reduced for stability
      hsv_s: 0.6         # Reduced for stability
      hsv_v: 0.3         # Reduced for stability
      degrees: 0.0       # Disabled - not useful for person detection
      translate: 0.05    # Reduced for stability
      scale: 0.3         # Reduced for stability
      shear: 0.0         # Disabled for speed
      perspective: 0.0   # Disabled for speed
      flipud: 0.0        # Disabled - not useful for persons
      fliplr: 0.5        # Keep horizontal flip
      mosaic: 0.8        # Moderate mosaic for data efficiency
      mixup: 0.0         # Disabled for training stability
      copy_paste: 0.0    # Disabled for speed

    # YOLO11x optimized training settings
    amp: True            # Essential for large model memory efficiency
    cache: True          # Enable for massive speed improvement
    device: ""
    workers: 12          # Moderate workers for stability
    val: True
    save_period: 5       # Save checkpoints less frequently
    patience: 15          # Reasonable patience for convergence
    plots: False         # Disable for speed
    verbose: False       # Reduce logging for speed

    # Additional YOLO11x optimizations
    freeze: 24           # Freeze more layers for stability
    warmup_epochs: 5     # Longer warmup for large model
    cos_lr: True         # Cosine LR scheduling
    close_mosaic: 15     # Close mosaic later
    dropout: 0.1         # Light regularization
