_target_: tracklab.callbacks.evaluation_callback.EvaluationCallback
export_path: "${callbacks.export_callback.save_path}"  # Use the same path as export callback

eval_cfg:
  _target_: tracklab.callbacks.evaluation_callback.trackeval_evaluator.TrackEvalEvaluator
  show_progressbar: True  # Show progressbar during evaluation
  eval_set: ${dataset.eval_set}
  dataset_path: ${dataset.dataset_path}
  dataset: ${dataset.track_eval}
  metrics:  # List of performance metrics to compute as listed in "trackeval.metrics"
    - "CLEAR"
    - "HOTA"
    - "Identity"
  eval:  # TrackEval configuration
    USE_PARALLEL: False  # Disable parallel processing to avoid pickling issues
    NUM_PARALLEL_CORES: 1  # Use single core when parallel is disabled
    BREAK_ON_ERROR: False  # Don't crash on individual sequence errors
    PRINT_CONFIG: False  # Don't print TrackEval config details
